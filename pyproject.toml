[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-order-preparation"
version = "0.1.0"
description = "Read-only Meridian order preparation prototype"
requires-python = ">=3.9"
dependencies = [
    "pypdfium2>=4.30,<6",
    "pytesseract>=0.3.13,<0.4",
]

[tool.setuptools.packages.find]
where = ["src"]
